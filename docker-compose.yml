services:
  app:
    build: .
    container_name: twitter_app
    ports:
      - "8000:8000"
    volumes:
      - ./twitter_classifier/tweets.sqlite:/app/twitter_classifier/tweets.sqlite
    environment:
      - PYTHONPATH=/app/twitter_classifier
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s