<!doctype html>
<html>
    <head>
        <title>Tweet Classification</title>
        <link rel="stylesheet"
              href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="container">
             <h2>Please enter your tweet:</h2>

            {% from '_formhelpers.html' import render_field %}
            <form method="post" action="/results">
                <dl class="tweet-container">
                    {{ render_field(form.tweet) }}
                </dl>
                <div class="button-container">
                    <input class="big-button" type="submit" value="Submit" name="submit_btn">
                </div>
            </form>
        </div>
    </body>
</html>
